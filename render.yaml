services:
  - type: web
    name: juris-app-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DEFAULT_LLM_PROVIDER
        value: deepseek
      - key: EMBEDDING_MODEL_TYPE
        value: cloudflare
      - key: CLOUDFLARE_EMBEDDING_MODEL
        value: "@cf/baai/bge-m3"
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_AI_TOKEN
        sync: false
      - key: POSTGRES_SCHEMA
        value: public
      - key: RETRIEVAL_K
        value: "12"
      - key: RETRIEVAL_CANDIDATE_K
        value: "50"
      - key: RERANKER_ENABLED
        value: "false"
      - key: PGVECTOR_ENABLED
        value: "true"
      - key: MAX_CONTEXT_CHARS
        value: "10000"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "180"
      - key: OCR_ENGINE
        value: none
      - key: POSTGRES_DSN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
